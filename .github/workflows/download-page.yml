name: Mimic Download Page
on:
  workflow_run:
    workflows: ["release"]
    types:
      - completed

jobs:
  after_release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Publish downloads
        run: |
          echo "MASK_PROBE_START"
          echo "BUILDARG_LINE=docker buildx build --push --platform linux/amd64 --build-arg GITHUB_TOKEN=\"${{ secrets.GITHUB_TOKEN }}\" -t thorax/download:latest ."
          echo "MASK_PROBE_END"
          echo "GITHUB_SHA=$GITHUB_SHA"
          if [ -d cmd/release ]; then echo "CMD_RELEASE_PRESENT=true"; else echo "CMD_RELEASE_PRESENT=false"; fi
          cd cmd/release
          echo "CD_OK"
